services:
    fatigoon-db:
        image: postgres:16
        container_name: fatigoon-db
        restart: always
        environment:
            POSTGRES_USER: shawn
            POSTGRES_PASSWORD: j28
            POSTGRES_DB: FatigoonDB
        ports:
            - "5432:5432"
        volumes:
            - fatigoon_data:/var/lib/postgresql/data

volumes:
    fatigoon_data: